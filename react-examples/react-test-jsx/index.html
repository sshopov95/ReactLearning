<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>React example 1</title>
    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <!-- JSX wrapper -->
  </head>
  <body>
    <div id="root"></div>
    <!-- SPA-->

    <script type="text/babel">
      //type-a задължително или не работи
      function Header() {
        return (
          <header>
            <h2>App Header</h2>
          </header>
        );
      }

      function App() {
        const name = 'Ivan';
        const member = true;
        return (
          //<div>
          //  <Header />
          //  <h1>Hello React</h1>
          //</div>
            
          <>                           
            <Header />
            <h1>Hello {name}</h1>
            {member ? <p>Wellcome back</p> : <p>Login pls</p>}
          </>
        ); //Задължително трябва да връща 1 parent 
            // <> или<React.Fragment> е фрагмент който реално не добавя нищо в крайната страница (избягване на div parrent)
      }
      const container = document.getElementById("root");
      const root = ReactDOM.createRoot(container);
      root.render(React.createElement(App));
    </script>
  </body>
</html>
